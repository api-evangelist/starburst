aid: starburst
name: Starburst
description: >-
  Starburst is an enterprise data analytics and intelligence platform built on Trino, the
  open-source distributed SQL query engine. It lets organizations access and query data across
  disparate systems through a unified context layer — federated analytics with no pipelines or
  data movement required. Its products include Starburst Galaxy (a fully managed cloud service on
  AWS, GCP, and Azure), Starburst Enterprise (self-managed for hybrid and on-premises), Icehouse
  (Apache Iceberg plus Trino for the lakehouse), and AIDA, a conversational AI data assistant.
  Starburst Galaxy exposes a public REST API secured with OAuth2 client credentials for managing
  clusters, catalogs, users, roles, privileges, access policies, data products, and SQL jobs.
